<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax Premier - Hệ Thống Đặt Vé Xem Phim Chuẩn Quốc Tế & Lab SQL Server</title>

    <!-- Google Fonts: Cinzel (Classic Cinema Headings), Playfair Display (Luxury Serif), Plus Jakarta Sans (Body), JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (Play CDN with Vintage Cinema Theme Config) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              vintage: {
                noir: '#0C0A08',
                espresso: '#120F0D',
                walnut: '#1A1612',
                card: '#201B16',
                cardHover: '#2A241E',
                wine: '#8E1E24',
                wineHover: '#A8242B',
                curtain: '#B3262E',
                gold: '#D4AF37',
                brass: '#C5A059',
                amber: '#E5A84B',
                cream: '#F6ECE1',
                parchment: '#EAE0D5',
                muted: '#A8998A',
                border: 'rgba(212, 175, 55, 0.18)'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['"Playfair Display"', 'serif'],
              cinzel: ['"Cinzel"', 'serif'],
              heading: ['"Cinzel"', '"Outfit"', 'serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>

    <!-- Bespoke Cinema Styling (Curved IMAX Screen, 3D Seats, Hologram Foil) -->
    <link rel="stylesheet" href="cinema.css">

    <!-- React 18 & ReactDOM Production UMD -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel Standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="cinema-bg text-slate-100 antialiased overflow-x-hidden">
    <!-- React Root Container -->
    <div id="root">
        <!-- Initial Preloader before React Mounts -->
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0B0B0F; color: #fff; font-family: 'Outfit', sans-serif;">
            <div style="font-size: 3rem; margin-bottom: 1rem; animation: pulse 1.5s infinite;">🎬</div>
            <div style="font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; background: linear-gradient(90deg, #E50914, #F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                CINEMAX PREMIER
            </div>
            <div style="font-size: 0.75rem; color: #64748b; font-family: monospace; letter-spacing: 4px; margin-top: 6px;">
                ĐANG KHỞI ĐỘNG HỆ THỐNG RẠP...
            </div>
        </div>
    </div>

    <!-- React Application Component Script -->
    <script type="text/babel" src="app.jsx"></script>
</body>
</html>
